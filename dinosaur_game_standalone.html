    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 🔊 1. Web Audio API Synthesizer Controller
    // ==========================================
    class SoundController {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFeatherCollect() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      playEat() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playWaterSplash() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playTRexCatch() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playWin() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          if (!this.ctx) return;
          const now = this.ctx.currentTime + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        });
      }

      playFail() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const notes = [400, 350, 300, 220];
        notes.forEach((freq, idx) => {
          if (!this.ctx) return;
          const now = this.ctx.currentTime + idx * 0.15;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        });
      }

      playMeteorExplosion() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 1.8);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.0);
      }

      playBirdChirp() {
        if (!this.enabled) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chirps = [
          { f1: 1800, f2: 2600, t: 0 },
          { f1: 2400, f2: 3200, t: 0.12 },
          { f1: 2200, f2: 3000, t: 0.28 },
        ];
        chirps.forEach(c => {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + c.t;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(c.f1, t);
          osc.frequency.exponentialRampToValueAtTime(c.f2, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.1);
        });
      }
    }

    // ==========================================
    // 🎮 6. Stage 1 Game: Microraptor Feather Collect
    // ==========================================
    const Stage1Game = ({ onStagePass, onRestartAll, onHome }) => {
      const containerRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(30);
      const [temperature, setTemperature] = useState(100);
      const [playerPos, setPlayerPos] = useState({ x: 50, y: 50 });
      const [feathers, setFeathers] = useState([]);
      const [feathersCollected, setFeathersCollected] = useState(0);
      const [isGameOver, setIsGameOver] = useState(false);
      const [floatingTexts, setFloatingTexts] = useState([]);
      const [facingLeft, setFacingLeft] = useState(false);

      const playerPosRef = useRef({ x: 50, y: 50 });

      const addFloatingText = (text, x, y) => {
        const id = Date.now() + Math.random();
        setFloatingTexts((prev) => [...prev, { id, text, x, y }]);
        setTimeout(() => {
          setFloatingTexts((prev) => prev.filter((item) => item.id !== id));
        }, 850);
      };

      const resetGame = () => {
        setTimeLeft(30);
        setTemperature(100);
        setPlayerPos({ x: 50, y: 50 });
        playerPosRef.current = { x: 50, y: 50 };
        setFeathers([]);
        setFeathersCollected(0);
        setIsGameOver(false);
        setFacingLeft(false);
      };

      const handlePointerMove = (e) => {
        if (!containerRef.current || isGameOver) return;
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.min(Math.max(((clientX - rect.left) / rect.width) * 100, 5), 95);
        const y = Math.min(Math.max(((clientY - rect.top) / rect.height) * 100, 5), 95);

        if (x < playerPosRef.current.x - 0.2) setFacingLeft(true);
        else if (x > playerPosRef.current.x + 0.2) setFacingLeft(false);

        playerPosRef.current = { x, y };
        setPlayerPos({ x, y });
      };

      useEffect(() => {
        if (isGameOver) return;
        const timer = setInterval(() => {
          setTimeLeft((t) => {
            if (t <= 1) {
              clearInterval(timer);
              sound.playWin();
              onStagePass();
              return 0;
            }
            return t - 1;
          });
          setTemperature((temp) => {
            const nextTemp = temp - 4.5;
            if (nextTemp <= 0) {
              clearInterval(timer);
              sound.playFail();
              setIsGameOver(true);
              return 0;
            }
            return nextTemp;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isGameOver, onStagePass]);

      useEffect(() => {
        if (isGameOver) return;
        const spawner = setInterval(() => {
          if (feathers.length >= 6) return;
          const newFeather = {
            id: 'feather_' + Date.now() + '_' + Math.random(),
            x: Math.random() * 85 + 7.5,
            y: Math.random() * 75 + 10,
            type: 'feather',
            points: 1,
            size: 28,
            createdAt: Date.now()
          };
          setFeathers((prev) => [...prev, newFeather]);
        }, 600);
        return () => clearInterval(spawner);
      }, [feathers.length, isGameOver]);

      useEffect(() => {
        if (isGameOver) return;
        const gameLoop = setInterval(() => {
          const p = playerPosRef.current;
          setFeathers((prev) => {
            const remaining = [];
            prev.forEach((feather) => {
              const dx = Math.abs(feather.x - p.x);
              const dy = Math.abs(feather.y - p.y);
              if (dx < 9 && dy < 9) {
                sound.playFeatherCollect();
                setFeathersCollected((c) => c + 1);
                setTemperature((temp) => Math.min(temp + 9, 100));
                addFloatingText('+9% 體溫 🔥', feather.x, feather.y);
              } else if (Date.now() - feather.createdAt < 4500) {
                remaining.push(feather);
              }
            });
            return remaining;
          });
        }, 50);
        return () => clearInterval(gameLoop);
      }, [isGameOver]);

      return (
        <div
          ref={containerRef}
          onMouseMove={handlePointerMove}
          onTouchMove={handlePointerMove}
          className="relative w-full h-full min-h-[550px] bg-gradient-to-b from-sky-900 via-slate-800 to-stone-900 overflow-hidden select-none cursor-crosshair"
        >
          {/* Ancient Jurassic Primeval Fern Forest Background */}
          <div className="absolute inset-0 pointer-events-none overflow-hidden opacity-45">
            <svg viewBox="0 0 1000 650" preserveAspectRatio="none" className="w-full h-full">
              <defs>
                <linearGradient id="s1FernGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#15803D" />
                  <stop offset="100%" stopColor="#14532D" />
                </linearGradient>
              </defs>
              {/* Rolling Ancient Forest Ground */}
              <path d="M 0 450 Q 200 410 450 440 T 800 420 T 1000 450 L 1000 650 L 0 650 Z" fill="#2E2016" />
              <path d="M 0 510 Q 300 470 600 520 T 1000 490 L 1000 650 L 0 650 Z" fill="#1C140E" opacity="0.9" />
              {/* Mossy rocks */}
              <ellipse cx="280" cy="560" rx="90" ry="40" fill="#3D4A2D" />
              <ellipse cx="720" cy="580" rx="110" ry="45" fill="#382A1E" />
              {/* Left Ancient Tree Fern */}
              <path d="M 90 650 Q 105 500 120 370 Q 135 500 150 650 Z" fill="#2E2016" stroke="#1A120C" strokeWidth="3" />
              <path d="M 120 370 Q 30 330 -40 380 Q 20 360 120 370 Z" fill="url(#s1FernGrad)" />
              <path d="M 120 370 Q 220 310 310 360 Q 220 345 120 370 Z" fill="url(#s1FernGrad)" />

              <div className="relative bg-teal-950/70 backdrop-blur-md border-2 border-cyan-300 p-2 rounded-full shadow-[0_0_15px_rgba(6,182,212,0.8)] flex items-center justify-center animate-pulse">
                {p.type === 'coelacanth' ? (
                  <CoelacanthAvatar className="w-9 h-7" />
                ) : p.type === 'ammonite' ? (
                  <AmmoniteAvatar className="w-8 h-7" />
                ) : (
                  <SquidAvatar className="w-8 h-7" />
                )}
                <span className="absolute -bottom-3 text-[9px] font-black bg-stone-900/95 text-cyan-300 px-1.5 py-0.2 rounded-full border border-cyan-400 shadow">
                  +{p.points}
                </span>
              </div>
            </div>
          ))}

          {/* Player */}
          <div
            className="absolute w-28 h-20 transition-transform duration-75 origin-center"
            style={{ left: `${playerPos.x}%`, top: `${playerPos.y}%`, transform: `translate(-50%, -50%) scaleX(${playerFacingLeft ? -1 : 1})` }}
          >
            {playerCharacter === 'elasmosaurus' ? <ElasmosaurusAvatar /> : <MosasaurusAvatar />}
          </div>

          {/* AI Rival */}
          <div
            className="absolute w-28 h-20 opacity-80 transition-transform duration-75 origin-center"
            style={{ left: `${aiPos.x}%`, top: `${aiPos.y}%`, transform: `translate(-50%, -50%) scaleX(${aiFacingLeft ? -1 : 1})` }}
          >
            {aiCharacter === 'elasmosaurus' ? <ElasmosaurusAvatar /> : <MosasaurusAvatar />}
          </div>

          {/* Floating texts */}
          {floatingTexts.map((ft) => (
            <div
              key={ft.id}
              className="absolute text-xs font-black text-cyan-300 animate-float-text bg-black/70 px-2 py-0.5 rounded-full border border-cyan-400"
              style={{ left: `${ft.x}%`, top: `${ft.y}%` }}
            >
              {ft.text}
            </div>
          ))}

          {isGameOver && (
            <GameOverModal
              reason="starve"
              stageNumber={3}
              message={`深海競爭結束！你的分數 (${playerScore}分) 未能超越對手 (${aiScore}分)，在水壓與食物匱乏中餓死失敗了！`}
              onRetry={resetGame}
              onRestartAll={onRestartAll}
              onHome={onHome}
            />
          )}
        </div>
      );
    };

    // ==========================================
    // 🦖 9. Stage 4 Game: T-Rex Hunting Compsognathus (Goal: 20 caught)
    // ==========================================
    const Stage4Game = ({ onStagePass, onRestartAll, onHome }) => {
      const containerRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(30);
      const [caughtCount, setCaughtCount] = useState(0);
      const [playerPos, setPlayerPos] = useState({ x: 50, y: 50 });
      const [compys, setCompys] = useState([]);
      const [isGameOver, setIsGameOver] = useState(false);
      const [isBiting, setIsBiting] = useState(false);
      const [facingLeft, setFacingLeft] = useState(false);
      const [floatingTexts, setFloatingTexts] = useState([]);

      const playerPosRef = useRef({ x: 50, y: 50 });
      const targetPosRef = useRef({ x: 50, y: 50 });
      const caughtCountRef = useRef(0);
      const caughtIdsRef = useRef(new Set());
      const compysRef = useRef([]);

      caughtCountRef.current = caughtCount;
      compysRef.current = compys;

      const addFloatingText = (text, x, y) => {
        const id = Date.now() + Math.random();
        setFloatingTexts((prev) => [...prev, { id, text, x, y }]);
        setTimeout(() => {
          setFloatingTexts((prev) => prev.filter((item) => item.id !== id));
        }, 850);
      };

      const attemptCatch = useCallback((pos) => {
        const biteRadius = 13.5;
        const currentCompys = compysRef.current;

        const targetCompy = currentCompys.find((compy) => {
          if (caughtIdsRef.current.has(compy.id)) return false;
          const dx = Math.abs(compy.x - pos.x);
          const dy = Math.abs(compy.y - pos.y);
          return Math.hypot(dx, dy) < biteRadius;
        });

        if (targetCompy) {
          caughtIdsRef.current.add(targetCompy.id);
          setCompys((prev) => prev.filter((c) => c.id !== targetCompy.id));
          sound.playTRexCatch();
          setIsBiting(true);
          setTimeout(() => setIsBiting(false), 250);

          setCaughtCount((c) => {
            const newCount = c + 1;
            caughtCountRef.current = newCount;
            addFloatingText(`捕獲美頜龍! (${newCount}/20)`, targetCompy.x, targetCompy.y);
            if (newCount >= 20) {
              sound.playWin();
              onStagePass();
            }
            return newCount;
          });
        }
      }, [onStagePass]);

      const resetGame = () => {
        setPlayerPos({ x: 50, y: 50 });
        targetPosRef.current = { x: 50, y: 50 };
        playerPosRef.current = { x: 50, y: 50 };
        setCaughtCount(0);
        caughtCountRef.current = 0;
        caughtIdsRef.current.clear();
        setTimeLeft(30);
        setCompys([]);
        compysRef.current = [];
        setIsGameOver(false);
      };

      const handlePointerMove = (e) => {
        if (!containerRef.current || isGameOver) return;
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.min(Math.max(((clientX - rect.left) / rect.width) * 100, 5), 95);
        const y = Math.min(Math.max(((clientY - rect.top) / rect.height) * 100, 5), 95);
        targetPosRef.current = { x, y };
      };

      // T-Rex Movement Loop (deliberate heavier predator inertia ~0.105)
      useEffect(() => {
        if (isGameOver) return;
        const moveLoop = setInterval(() => {
          const target = targetPosRef.current;
          const prev = playerPosRef.current;
          const dx = target.x - prev.x;
          const dy = target.y - prev.y;

          if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;

          if (dx < -0.4) setFacingLeft(true);
          else if (dx > 0.4) setFacingLeft(false);

          const nextPos = {
            x: prev.x + dx * 0.105,
            y: prev.y + dy * 0.105
          };

          playerPosRef.current = nextPos;
          setPlayerPos(nextPos);
          attemptCatch(nextPos);
        }, 35);
        return () => clearInterval(moveLoop);
      }, [isGameOver, attemptCatch]);

      // Spawn Compsognathus interval 850ms (generous chance to reach 20 in 30s)
      useEffect(() => {
        if (isGameOver) return;
        const spawner = setInterval(() => {
          if (compysRef.current.length >= 5) return;
          const newCompy = {
            id: Date.now() + Math.random(),
            x: Math.random() * 80 + 10,
            y: Math.random() * 75 + 12,
            spawnTime: Date.now(),
            duration: Math.floor(Math.random() * 800) + 2400,
            facingLeft: Math.random() > 0.5
          };
          setCompys((prev) => [...prev, newCompy]);
        }, 850);
        return () => clearInterval(spawner);
      }, [isGameOver]);

      // Timer & Win Condition (>= 20)
      useEffect(() => {
        if (isGameOver) return;
        const timer = setInterval(() => {
          setTimeLeft((t) => {
            if (t <= 1) {
              clearInterval(timer);
              if (caughtCountRef.current >= 20) {
                sound.playWin();
                onStagePass();
              } else {
                sound.playFail();
                setIsGameOver(true);
              }
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isGameOver, onStagePass]);

      useEffect(() => {
        if (isGameOver) return;
        const gameLoop = setInterval(() => {
          const now = Date.now();
          setCompys((prev) => prev.filter((c) => now - c.spawnTime < c.duration));
          attemptCatch(playerPosRef.current);
        }, 50);
        return () => clearInterval(gameLoop);
      }, [isGameOver, attemptCatch]);

      return (
        <div
          ref={containerRef}
          onMouseMove={handlePointerMove}
          onTouchMove={handlePointerMove}
          className="relative w-full h-full min-h-[550px] bg-gradient-to-b from-[#2E1A14] via-[#45281F] to-[#1E110C] overflow-hidden select-none cursor-crosshair"
        >
          {/* Prehistoric Earthy Mud Ground Terrain (泥土地質感、裂痕與足跡) */}
          <div className="absolute inset-0 pointer-events-none overflow-hidden z-0">
            <svg viewBox="0 0 1000 700" preserveAspectRatio="none" className="w-full h-full opacity-90">
              <defs>
                <radialGradient id="s4MudPuddle1" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stopColor="#140B07" stopOpacity="0.9" />
                  <stop offset="70%" stopColor="#2A170E" stopOpacity="0.6" />
                  <stop offset="100%" stopColor="#45281F" stopOpacity="0" />
                </radialGradient>
                <radialGradient id="s4MudPuddle2" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stopColor="#100805" stopOpacity="0.95" />
                  <stop offset="65%" stopColor="#22130C" stopOpacity="0.7" />
                  <stop offset="100%" stopColor="#45281F" stopOpacity="0" />
                </radialGradient>
                <linearGradient id="s4HorizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#7C2D12" stopOpacity="0.6" />
                  <stop offset="40%" stopColor="#451A03" stopOpacity="0.3" />
                  <stop offset="100%" stopColor="#1E110C" stopOpacity="0" />
                </linearGradient>
                <linearGradient id="s4FernBg" x1="0%" y1="100%" x2="0%" y2="0%">
                  <stop offset="0%" stopColor="#14532D" stopOpacity="0.7" />
                  <stop offset="100%" stopColor="#22C55E" stopOpacity="0.2" />
                </linearGradient>
              </defs>

              {/* Volcanic glow & ridges */}
              <rect x="0" y="0" width="1000" height="240" fill="url(#s4HorizonGlow)" />
              <path d="M 0 180 Q 250 120 500 160 T 1000 130 L 1000 280 L 0 280 Z" fill="#241209" opacity="0.8" />
              <path d="M 0 220 Q 300 170 650 210 T 1000 180 L 1000 320 L 0 320 Z" fill="#1C0E07" opacity="0.9" />

              {/* Mud Depressions */}
              <ellipse cx="220" cy="260" rx="140" ry="70" fill="url(#s4MudPuddle1)" />
              <ellipse cx="750" cy="450" rx="180" ry="85" fill="url(#s4MudPuddle2)" />
              <ellipse cx="440" cy="580" rx="130" ry="60" fill="url(#s4MudPuddle1)" />
              <ellipse cx="820" cy="240" rx="110" ry="50" fill="url(#s4MudPuddle2)" />
              <ellipse cx="140" cy="520" rx="100" ry="50" fill="url(#s4MudPuddle1)" />

              {/* Soil cracks */}
              <path d="M 120 320 L 180 360 L 210 330 L 270 380 L 310 370" stroke="#0D0604" strokeWidth="3.5" fill="none" opacity="0.75" />
              <path d="M 180 360 L 170 410 L 200 430" stroke="#0D0604" strokeWidth="2.5" fill="none" opacity="0.65" />
              <path d="M 720 180 L 760 220 L 810 210 L 860 260" stroke="#0D0604" strokeWidth="3" fill="none" opacity="0.75" />
              <path d="M 480 430 L 520 480 L 500 520 L 560 550" stroke="#0D0604" strokeWidth="3.2" fill="none" opacity="0.75" />

              {/* Footprints in mud */}
              <g transform="translate(240, 380) rotate(-20) scale(0.95)" opacity="0.7" fill="#0A0503">
                <polygon points="26,12 33,0 40,12 35,38 27,38" />
                <polygon points="16,18 7,10 20,28" />
                <polygon points="50,18 59,10 46,28" />
              </g>
              <g transform="translate(680, 320) rotate(15) scale(1.1)" opacity="0.7" fill="#0A0503">
                <polygon points="26,12 33,0 40,12 35,38 27,38" />
                <polygon points="16,18 7,10 20,28" />
                <polygon points="50,18 59,10 46,28" />
              </g>
              <g transform="translate(480, 200) rotate(-10) scale(0.8)" opacity="0.6" fill="#0A0503">
                <polygon points="26,12 33,0 40,12 35,38 27,38" />
                <polygon points="16,18 7,10 20,28" />
                <polygon points="50,18 59,10 46,28" />
              </g>

              {/* Ambient ancient ferns */}
              <path d="M 0 300 Q 80 260 140 310 Q 70 320 0 350 Z" fill="url(#s4FernBg)" />
              <path d="M 1000 280 Q 920 240 860 290 Q 930 300 1000 330 Z" fill="url(#s4FernBg)" />
            </svg>
          </div>

          {/* Ambient Prehistoric Fern Bushes & Rocks */}
          <div className="absolute top-[22%] left-[18%] text-3xl opacity-80 pointer-events-none drop-shadow-md">🌿</div>
          <div className="absolute top-[65%] right-[22%] text-3xl opacity-80 pointer-events-none drop-shadow-md">🪨</div>
          <div className="absolute bottom-[18%] left-[30%] text-3xl opacity-80 pointer-events-none drop-shadow-md">🌿</div>
          <div className="absolute top-[32%] right-[18%] text-2xl opacity-80 pointer-events-none drop-shadow-md">🌱</div>

          {/* HUD */}
          <div className="absolute top-3 left-4 right-4 flex justify-between items-center z-30 pointer-events-none">
            <div className="bg-black/60 px-4 py-1.5 rounded-full border border-amber-500 text-amber-200 text-xs font-bold">
              ⏱️ 倒數：<span className="text-base text-yellow-300 font-mono">{timeLeft}s</span>
            </div>
            <div className="bg-[#6E7B36] text-white px-4 py-1.5 rounded-full text-xs font-black shadow-md">
              捕獲美頜龍：<span className={`text-base font-mono ${caughtCount >= 20 ? 'text-yellow-300 animate-pulse' : ''}`}>{caughtCount} / 20 隻</span>
            </div>
          </div>

          {/* Compsognathus with Glowing Beacon & Alert Tag */}
          {compys.map((c) => (
            <div
              key={c.id}
              className="absolute -translate-x-1/2 -translate-y-1/2 z-15 transition-transform animate-pulse"
              style={{
                left: `${c.x}%`,
                top: `${c.y}%`,
                transform: `translate(-50%, -50%) scaleX(${c.facingLeft ? -1 : 1})`
              }}
            >
              <div className="relative">
                <div className="absolute -top-3 -right-2 text-[10px] font-black text-amber-300 animate-bounce bg-black/60 px-1 rounded-full border border-amber-400 whitespace-nowrap">
                  ⚡快抓!
                </div>
                <div className="w-14 h-10 filter drop-shadow-[0_0_12px_rgba(74,222,128,1)] bg-emerald-950/40 rounded-full p-1 border border-emerald-400/50">
                  <CompsognathusAvatar />
                </div>
              </div>
            </div>
          ))}

          {/* T-Rex */}
          <div
            className="absolute w-32 h-24 origin-center transition-transform duration-75"
            style={{
              left: `${playerPos.x}%`,
              top: `${playerPos.y}%`,
              transform: `translate(-50%, -50%) scaleX(${facingLeft ? -1 : 1})`
            }}
          >
            <TRexAvatar isBiting={isBiting} />
          </div>

          {/* Floating Texts */}
          {floatingTexts.map((ft) => (
            <div
              key={ft.id}
              className="absolute text-xs font-black text-amber-300 animate-float-text bg-black/70 px-2.5 py-0.5 rounded-full border border-amber-400"
              style={{ left: `${ft.x}%`, top: `${ft.y}%` }}
            >
              {ft.text}
            </div>
          ))}

          {isGameOver && (
            <GameOverModal
              reason="starve"
              stageNumber={4}
              message={`30秒時間到！你僅捕捉到 ${caughtCount} 隻美頜龍（目標需 20 隻），因掠食不足霸王龍餓死失敗了！`}
              onRetry={resetGame}
              onRestartAll={onRestartAll}
              onHome={onHome}
            />
          )}
        </div>
      );
    };

    // ==========================================
    // 🌟 10. EndingCutscene (Meteor, Ruins, Morph, Story & Replay)
    // ==========================================
    const EndingCutscene = ({ onRestart, onHome, onSelectStage }) => {
      const [phase, setPhase] = useState('VICTORY');

      useEffect(() => {
        sound.playWin();
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        const timer1 = setTimeout(() => setPhase('METEOR_APPROACH'), 3200);
        return () => clearTimeout(timer1);
      }, []);

      useEffect(() => {
        if (phase === 'METEOR_APPROACH') {
          const timer = setTimeout(() => {
            sound.playMeteorExplosion();
            setPhase('EXPLOSION');
          }, 2500);
          return () => clearTimeout(timer);
        }
        if (phase === 'EXPLOSION') {
          const timer = setTimeout(() => setPhase('RUINS'), 2000);
          return () => clearTimeout(timer);
        }
        if (phase === 'RUINS') {
          const timer = setTimeout(() => {
            sound.playFeatherCollect();
            setPhase('FEATHER_MORPH');
          }, 2800);
          return () => clearTimeout(timer);
        }
        if (phase === 'FEATHER_MORPH') {
          const timer = setTimeout(() => {
            sound.playBirdChirp();
            setPhase('FINAL_REVELATION');
          }, 3500);
          return () => clearTimeout(timer);
        }
      }, [phase]);

      return (
        <div className="relative w-full h-full min-h-[600px] flex flex-col items-center justify-center p-4 bg-black text-white select-none">
          {phase === 'VICTORY' && (
            <div className="max-w-md text-center bg-[#FAF3E0] border-4 border-[#D9B99B] rounded-[36px] p-8 shadow-2xl flex flex-col items-center text-[#4A3728]">
              <div className="text-5xl mb-3 animate-bounce">🏆</div>
              <h2 className="text-3xl font-black text-[#6E7B36] mb-2">🎉 恭喜全部通關！</h2>
              <p className="text-sm text-[#5D4E42] mb-4 leading-relaxed font-medium">
                太厲害了！你成功經歷了小盜龍羽毛保暖、天空滑翔爭霸、深海巨獸掠食，以及霸王龍對美頜龍的終極追捕！
              </p>
              <div className="text-xs text-[#E67E22] font-bold animate-pulse">遠古時代的命運即將揭曉...</div>
            </div>
          )}

          {phase === 'METEOR_APPROACH' && (
            <div className="text-center">
              <span className="px-4 py-1 rounded-full bg-red-600/40 border border-red-500 text-red-300 font-bold text-xs">
                🔥 天降浩劫 · 白堊紀末期大滅絕
              </span>
              <h3 className="text-3xl font-black text-red-400 mt-4 animate-pulse">
                然而……命運不可逆轉的巨變降臨了！
              </h3>
              <div className="text-6xl mt-8 animate-bounce">☄️ 🌎</div>
            </div>
          )}

          {phase === 'EXPLOSION' && (
            <div className="text-center p-6 bg-red-600 rounded-3xl animate-pulse">
              <h2 className="text-4xl sm:text-5xl font-black text-yellow-200">💥 毀滅性的撞擊！</h2>
              <p className="text-stone-100 text-base mt-4 font-bold max-w-md">
                即使玩家全力過關，恐龍統治的時代依然在巨變中走向了終結……
              </p>
            </div>
          )}

          {phase === 'RUINS' && (
            <div className="text-center max-w-md">
              <p className="text-stone-400 text-lg italic leading-relaxed">
                天空被厚厚的塵埃籠罩，巨獸們的身影漸漸消失在廢墟之中……
              </p>
              <div className="my-6 text-3xl animate-pulse">🌫️ 🌋 🌫️</div>
              <p className="text-amber-400 text-sm">然而……在死寂與廢墟的正中央……</p>
            </div>
          )}

          {phase === 'FEATHER_MORPH' && (
            <div className="text-center flex flex-col items-center justify-center">
              <span className="text-xs text-amber-300 font-mono tracking-widest uppercase mb-4">✨ 生命的奇蹟演化 · The Miracle of Evolution</span>
              
              {/* Dedicated Glowing SVG Feather */}
              <div className="relative my-4 flex items-center justify-center animate-bounce">
                <div className="absolute -inset-10 rounded-full bg-amber-400/20 blur-2xl animate-pulse"></div>
                <div className="absolute -inset-4 rounded-full bg-yellow-300/30 blur-xl"></div>
                <svg viewBox="0 0 120 160" className="w-36 h-48 filter drop-shadow-[0_0_35px_rgba(251,191,36,0.95)] overflow-visible">
                  <defs>
                    <linearGradient id="sFeatherGold" x1="0%" y1="0%" x2="100%" y2="100%">

              <div className="bg-stone-900/90 px-5 py-2 rounded-full border border-amber-400 text-amber-200 text-xs font-bold shadow-[0_0_20px_rgba(245,158,11,0.4)]">

          {phase === 'FINAL_REVELATION' && (
            <div className="w-full max-w-xl bg-[#FAF3E0] border-4 border-[#D9B99B] rounded-[36px] p-6 text-center text-[#4A3728] shadow-2xl flex flex-col items-center">
              <ModernBirdAvatar className="w-28 h-24 mb-2" />

                演化的真相 · The Secret of Dinosaurs
              </div>
              <h2 className="text-2xl font-black text-[#6E7B36] mb-3">恐龍從未真正離去！</h2>
              <div className="p-4 bg-white/90 rounded-2xl border-2 border-[#D9B99B] text-xs sm:text-sm leading-relaxed text-[#5D4E42] space-y-2 mb-4 font-medium text-justify sm:text-center">
                <p>雖然大滅絕終結了陸地巨獸的時代，但少數披著羽毛的小型恐龍，依靠著羽毛的保暖與滑翔飛行，奇蹟般地在浩劫中存活了下來！</p>
                <p className="font-bold text-[#4A3728]">
                  牠們經歷漫長歲月演化成了今天的<span className="text-[#E67E22] font-black underline">「鳥類」</span>——此時此刻，牠們依然翱翔在藍天中，生活在你我的身邊！
                </p>
              </div>
              <div className="w-full border-t-2 border-[#D9B99B] pt-3 mb-3">
                <div className="text-xs text-[#9B7E6F] font-bold mb-2">重溫指定關卡：</div>
                <div className="grid grid-cols-4 gap-2 text-xs">
                  <button onClick={() => onSelectStage(1)} className="p-2 bg-white rounded-xl border-2 border-[#D9B99B] font-bold cursor-pointer hover:bg-stone-50">第1關</button>
                  <button onClick={() => onSelectStage(2)} className="p-2 bg-white rounded-xl border-2 border-[#D9B99B] font-bold cursor-pointer hover:bg-stone-50">第2關</button>
                  <button onClick={() => onSelectStage(3)} className="p-2 bg-white rounded-xl border-2 border-[#D9B99B] font-bold cursor-pointer hover:bg-stone-50">第3關</button>
                  <button onClick={() => onSelectStage(4)} className="p-2 bg-white rounded-xl border-2 border-[#D9B99B] font-bold cursor-pointer hover:bg-stone-50">第4關</button>
                </div>
              </div>
              <div className="w-full flex gap-3">
                <button
                  onClick={() => { sound.playWin(); onRestart(); }}
                  className="flex-1 py-3 bg-[#E67E22] hover:bg-[#D35400] text-white font-black rounded-full shadow-lg transition active:scale-95 cursor-pointer text-sm"
                >
                  🔄 重新玩一次全遊戲
                </button>
                <button
                  onClick={() => { sound.playEat(); onHome(); }}
                  className="py-3 px-5 bg-white hover:bg-stone-50 text-[#4A3728] font-bold rounded-full border-2 border-[#D9B99B] shadow-sm transition active:scale-95 cursor-pointer text-sm"
                >
                  🏠 回首頁
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 🏠 11. MainMenu Component
    // ==========================================
    const MainMenu = ({ onStartGame, isMuted, onToggleMute }) => {
      const [dinoPos, setDinoPos] = useState(15);
      const [direction, setDirection] = useState(1);

      useEffect(() => {
        const interval = setInterval(() => {
          setDinoPos((prev) => {
            if (prev >= 80) {
              setDirection(-1);
              return prev - 0.4;
            } else if (prev <= 12) {
              setDirection(1);
              return prev + 0.4;
            }
            return prev + direction * 0.4;
          });
        }, 30);
        return () => clearInterval(interval);
      }, [direction]);

      return (
        <div className="relative w-full h-full min-h-[600px] flex flex-col items-center justify-between p-4 sm:p-6 bg-[#FAF3E0] text-[#4A3728] select-none">
          {/* Header */}
          <nav className="w-full max-w-4xl flex justify-between items-center z-10 pt-2 px-2">
            <div className="flex items-center gap-2">
              <div className="w-10 h-10 bg-[#8B9A46] rounded-full flex items-center justify-center border-2 border-[#6E7B36] text-xl shadow-md">
                🦕
              </div>
              <div>
                <span className="text-xl font-black text-[#6E7B36] block leading-none">DINO DISCOVERY</span>
                <span className="text-[10px] font-bold text-[#9B7E6F] tracking-widest uppercase">立體影片巡禮遊戲</span>
              </div>
            </div>
            <button
              onClick={onToggleMute}
              className="px-3.5 py-1.5 rounded-full border-2 border-[#D9B99B] bg-white/80 hover:bg-white text-xs font-bold text-[#4A3728] shadow-sm cursor-pointer"
            >
              {isMuted ? "🔇 SOUND: OFF" : "🔊 SOUND: ON"}
            </button>
          </nav>

          {/* Running Dino Strip */}
          <div className="w-full max-w-2xl relative h-24 z-10 my-1 px-6 flex items-end">
            <div
              className="absolute bottom-1 transition-transform duration-75 origin-bottom"
              style={{
                left: `${dinoPos}%`,
                transform: `translateX(-50%) scaleX(${direction})`
              }}
            >
              <CuteMainDino className="w-24 h-20" isWalking={true} />
            </div>
            <div className="w-full flex items-center justify-between pb-1 border-b-2 border-dashed border-[#D9B99B]/60 text-xs text-[#9B7E6F]">
              <span>🌿</span>
              <span>🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾</span>
              <span>🌱</span>
            </div>
          </div>

          {/* Center Card */}
          <div className="w-full max-w-xl bg-white/90 p-6 sm:p-8 rounded-[36px] border-4 border-[#D9B99B] shadow-2xl text-center flex flex-col items-center my-auto z-10">
            <div className="px-3 py-0.5 bg-[#8B9A46]/20 text-[#6E7B36] text-xs font-black rounded-full mb-1">
              The Great Dinosaur
            </div>
            <h1 className="text-3xl font-black text-[#6E7B36]">立體影片《恐龍的秘密》</h1>
            <div className="text-base font-serif italic text-[#9B7E6F] font-semibold mb-3">The Great Dinosaur</div>

            <div className="p-4 bg-[#FAF3E0] rounded-2xl border-2 border-[#D9B99B] text-sm text-[#5D4E42] leading-relaxed font-medium mb-4 text-justify sm:text-center">
              喜歡恐龍嗎？了解恐龍嗎？想更認識恐龍嗎？<br />
              那就請來收看立體影片<span className="text-[#E67E22] font-black">《恐龍的秘密 The great dinosaur》</span>，並且玩玩這款小遊戲吧！
            </div>

            <button
              onClick={() => { sound.playWin(); onStartGame(); }}
              className="px-10 py-3.5 bg-[#E67E22] hover:bg-[#D35400] text-white font-black text-lg rounded-full shadow-lg transition active:scale-95 cursor-pointer"
            >
              進入遊戲 ▶
            </button>
          </div>

          {/* Level Badges */}
          <div className="w-full max-w-xl grid grid-cols-4 gap-2 z-10 mb-2 text-center text-xs font-bold text-[#5D4E42]">
            <div className="flex flex-col items-center">
              <div className="w-12 h-12 rounded-2xl bg-[#D9B99B] border-2 border-white shadow-md flex items-center justify-center text-xl mb-1">🪶</div>
              <span>LV 1: 禦寒</span>
            </div>
            <div className="flex flex-col items-center">
              <div className="w-12 h-12 rounded-2xl bg-[#A5C9CA] border-2 border-white shadow-md flex items-center justify-center text-xl mb-1">☁️</div>
              <span>LV 2: 空戰</span>
            </div>
            <div className="flex flex-col items-center">
              <div className="w-12 h-12 rounded-2xl bg-[#395B64] border-2 border-white shadow-md flex items-center justify-center text-xl mb-1 text-white">🌊</div>
              <span>LV 3: 海域</span>
            </div>
            <div className="flex flex-col items-center">
              <div className="w-12 h-12 rounded-2xl bg-[#A27B5C] border-2 border-white shadow-md flex items-center justify-center text-xl mb-1 text-white">🦖</div>
              <span>LV 4: 霸主</span>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 🚀 12. Main Application Container
    // ==========================================
    const App = () => {
      const [stage, setStage] = useState('MAIN_MENU');
      const [isMuted, setIsMuted] = useState(false);
      const [stage2Char, setStage2Char] = useState('archaeopteryx');
      const [stage3Char, setStage3Char] = useState('elasmosaurus');

      const toggleMute = () => {
        const next = !isMuted;
        setIsMuted(next);
        sound.enabled = !next;
      };

      const getStageInfo = () => {
        switch (stage) {
          case 'STAGE_1_INTRO':
          case 'STAGE_1_PLAY':
            return { num: 1, name: '小盜龍禦寒生存' };
          case 'STAGE_2_INTRO':
          case 'STAGE_2_PLAY':
            return { num: 2, name: '始祖鳥 vs 翼龍 空戰競賽' };
          case 'STAGE_3_INTRO':
          case 'STAGE_3_PLAY':
            return { num: 3, name: '薄板龍 vs 滄龍 深海狂潮' };
          case 'STAGE_4_INTRO':
          case 'STAGE_4_PLAY':
            return { num: 4, name: '霸王龍伏擊美頜龍' };
          default:
            return { num: undefined, name: undefined };
        }
      };

      const { num, name } = getStageInfo();

      return (
        <div className="w-full h-full flex flex-col overflow-hidden bg-[#FAF3E0]">
          {stage !== 'MAIN_MENU' && stage !== 'EPILOGUE' && (
            <HeaderNav
              currentStageNumber={num}
              stageName={name}
              isMuted={isMuted}
              onToggleMute={toggleMute}
              onHome={() => setStage('MAIN_MENU')}
            />
          )}

          <div className="flex-1 w-full h-full relative overflow-hidden flex flex-col">
            {stage === 'MAIN_MENU' && (
              <MainMenu
                onStartGame={() => setStage('STAGE_1_INTRO')}
                isMuted={isMuted}
                onToggleMute={toggleMute}
              />
            )}

            {stage === 'STAGE_1_INTRO' && (
              <StageIntroModal
                stageNumber={1}
                onStartStage={() => setStage('STAGE_1_PLAY')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'STAGE_1_PLAY' && (
              <Stage1Game
                onStagePass={() => setStage('STAGE_2_INTRO')}
                onRestartAll={() => setStage('STAGE_1_INTRO')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'STAGE_2_INTRO' && (
              <StageIntroModal
                stageNumber={2}
                onStartStage={() => setStage('STAGE_2_PLAY')}
                onHome={() => setStage('MAIN_MENU')}
                stage2Char={stage2Char}
                setStage2Char={setStage2Char}
              />
            )}

            {stage === 'STAGE_2_PLAY' && (
              <Stage2Game
                playerCharacter={stage2Char}
                onStagePass={() => setStage('STAGE_3_INTRO')}
                onRestartAll={() => setStage('STAGE_1_INTRO')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'STAGE_3_INTRO' && (
              <StageIntroModal
                stageNumber={3}
                onStartStage={() => setStage('STAGE_3_PLAY')}
                onHome={() => setStage('MAIN_MENU')}
                stage3Char={stage3Char}
                setStage3Char={setStage3Char}
              />
            )}

            {stage === 'STAGE_3_PLAY' && (
              <Stage3Game
                playerCharacter={stage3Char}
                onStagePass={() => setStage('STAGE_4_INTRO')}
                onRestartAll={() => setStage('STAGE_1_INTRO')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'STAGE_4_INTRO' && (
              <StageIntroModal
                stageNumber={4}
                onStartStage={() => setStage('STAGE_4_PLAY')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'STAGE_4_PLAY' && (
              <Stage4Game
                onStagePass={() => setStage('EPILOGUE')}
                onRestartAll={() => setStage('STAGE_1_INTRO')}
                onHome={() => setStage('MAIN_MENU')}
              />
            )}

            {stage === 'EPILOGUE' && (
              <EndingCutscene
                onRestart={() => setStage('STAGE_1_INTRO')}
                onHome={() => setStage('MAIN_MENU')}
                onSelectStage={(s) => {
                  if (s === 1) setStage('STAGE_1_INTRO');
                  else if (s === 2) setStage('STAGE_2_INTRO');
                  else if (s === 3) setStage('STAGE_3_INTRO');
                  else if (s === 4) setStage('STAGE_4_INTRO');
                }}
              />
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
